{% extends "cores/base.html" %}

{% block title %}
   Edit post
{% endblock %}

{% block content %}
<!-- Display messages -->
{% if messages %}
<div class="container mt-3">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
    <div class="container mt-5 bg-secondary border border mb-3">
        <h1 class="text-center mb-4">Edit Job</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="form-group" action="" enctype="multipart/form-data" method="POST">
                    {% csrf_token %}
                    {% load crispy_forms_tags %}
                    {{ form|crispy }}
                    {{form.media}}
                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-info mb-2">update</button>
                        <a href="{% url 'E-dashboard' %}"  class=" btn btn-primary ml-3">cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
